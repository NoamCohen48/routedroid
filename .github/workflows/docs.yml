# The documentation site (docs/site, an mdBook), published to GitHub Pages on
# every push to main that changes it, and after each release (release.yml
# runs it). Pull requests only build it, so a broken book fails before it is
# merged. Pages must be set to deploy from GitHub Actions (Settings, Pages,
# Source).
#
# Beside the book it carries apt/, an apt repository of every release's
# .deb signed with the APT_SIGNING_KEY secret (host/packaging/apt-key.sh
# makes it), and download/, the latest release's files.
name: docs

on:
  push:
    branches: [main]
    paths: ["docs/site/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one
# that is halfway published.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.4.52"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: mdbook build docs/site
      - name: The apt repository and the downloads
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName')
          if [ -z "$tags" ]; then echo "no release yet: no apt repository or downloads"; exit 0; fi
          latest=$(echo "$tags" | head -1)
          book=docs/site/book
          gh release download "$latest" --repo "$GITHUB_REPOSITORY" -D "$book/download"
          {
            echo "<!doctype html><meta charset=utf-8><title>Routedroid $latest downloads</title>"
            echo "<h1>Routedroid $latest</h1><ul>"
            for f in "$book"/download/*; do n=$(basename "$f"); echo "<li><a href=\"$n\">$n</a></li>"; done
            echo "</ul>"
          } > "$book/download/index.html"
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::warning::no APT_SIGNING_KEY secret (host/packaging/apt-key.sh): no apt repository"; exit 0
          fi
          for tag in $tags; do gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p '*.deb' -D "$RUNNER_TEMP/debs"; done
          host/packaging/apt-repo.sh "$book/apt" "$RUNNER_TEMP"/debs/*.deb
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
