# The documentation site (docs/site, an mdBook), published to GitHub Pages on
# every push to main that changes it. Pull requests only build it, so a broken
# book fails before it is merged. Pages must be set to deploy from GitHub
# Actions (Settings, Pages, Source).
name: docs

on:
  push:
    branches: [main]
    paths: ["docs/site/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one
# that is halfway published.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.4.52"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: mdbook build docs/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
