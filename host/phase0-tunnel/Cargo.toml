[package]
name = "phase0-tunnel"
version = "0.0.1"
description = "Routedroid Phase 0 §3.1 throwaway host probe: TUN <-> adb reverse TCP packet tunnel"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "phase0-tunnel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
