[package]
name = "routedroidd"
version = "0.1.0"
description = "Routedroid daemon: owns phone sessions (ADB, protocol, helper) and serves the control socket"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "routedroidd"
path = "src/main.rs"

[dependencies]
routedroid-helper-ipc = { path = "../helper-ipc" }
routedroid-ipc = { path = "../routedroid-ipc" }
routedroid-proto = { path = "../routedroid-proto" }
anyhow = "1"
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
