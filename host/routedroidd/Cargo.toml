[package]
name = "routedroidd"
version.workspace = true
description = "Routedroid daemon: owns phone sessions (ADB, protocol, helper) and serves the control socket"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "routedroidd"
path = "src/main.rs"

[dependencies]
routedroid-helper-ipc.workspace = true
routedroid-ipc.workspace = true
routedroid-proto.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
futures-util.workspace = true
hex.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "signal", "fs"] }
tokio-util = { workspace = true, features = ["codec"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
