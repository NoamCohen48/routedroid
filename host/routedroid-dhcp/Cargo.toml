[package]
name = "routedroid-dhcp"
version.workspace = true
description = "Routedroid DHCP alias client: an extra DHCP identity on a physical interface, never assigned locally"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "routedroid-dhcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
