[package]
name = "routedroid"
version.workspace = true
description = "Routedroid command line: a client of routedroidd"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "routedroid"
path = "src/main.rs"

[dependencies]
routedroid-ipc = { path = "../routedroid-ipc" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
serde = "1"
humantime = "2"

[lints]
workspace = true
