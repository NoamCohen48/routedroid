[package]
name = "routedroid"
version.workspace = true
description = "Routedroid command line: a client of routedroidd"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "routedroid"
path = "src/main.rs"

[dependencies]
routedroid-helper-ipc.workspace = true
routedroid-ipc.workspace = true
anyhow.workspace = true
chrono = { workspace = true, features = ["clock"] }
clap = { workspace = true, features = ["env"] }
clap_complete.workspace = true
clap_mangen.workspace = true
humantime.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
toml = { workspace = true, features = ["parse", "serde"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }

[lints]
workspace = true
