[package]
name = "phase0-helper"
version = "0.0.1"
description = "Routedroid Phase 0 helper-gate spike: privileged per-session daemon with write-ahead journal, systemd cleanup, and a SOCK_SEQPACKET packet relay"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "phase0-helper"
path = "src/main.rs"

[dependencies]
routedroid-helper-ipc = { path = "../helper-ipc" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
