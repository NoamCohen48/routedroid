[package]
name = "routedroid-helper-ipc"
version = "0.1.0"
description = "Controller <-> privileged helper IPC: version handshake, typed control messages and raw IPv4 packets over one Unix SOCK_SEQPACKET connection"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rustix = { version = "1", features = ["net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["net"] }

[dev-dependencies]
rustix = { version = "1", features = ["process"] }
tokio = { version = "1", features = ["macros", "rt"] }
