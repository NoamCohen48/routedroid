[package]
name = "routedroid-proto"
version.workspace = true
description = "Routedroid wire protocol version 1: framing, control bodies, session state allowlist, bootstrap record, mutual HMAC (protocol/version-1.md)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
zeroize = "1"
getrandom = { version = "0.2", features = ["std"] }
thiserror = "1"
tokio = { version = "1", features = ["io-util"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "io-util"] }
