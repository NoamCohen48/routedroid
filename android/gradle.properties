org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
org.gradle.configuration-cache=true

# JDK selection for the Gradle daemon lives in gradle/gradle-daemon-jvm.properties
# (Gradle "daemon JVM criteria"), so this file stays machine-independent. If that
# mechanism cannot find or provision a JDK 17 on your machine, uncomment and point
# this at a local JDK 17 (see README.md):
#org.gradle.java.home=/path/to/jdk-17
