# Every dependency and plugin version of the Android build, in one place.
[versions]
agp = "9.0.1"
# Must match the Kotlin that AGP 9 bundles for its built-in Kotlin support.
kotlin = "2.2.10"
coroutines = "1.10.2"
junit = "4.13.2"

[libraries]
androidx-core = "androidx.core:core-ktx:1.18.0"
androidx-appcompat = "androidx.appcompat:appcompat:1.7.1"
androidx-activity = "androidx.activity:activity-ktx:1.13.0"
androidx-lifecycle-runtime = "androidx.lifecycle:lifecycle-runtime-ktx:2.9.4"
material = "com.google.android.material:material:1.13.0"
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
